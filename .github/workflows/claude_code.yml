name: Weekly Unit Tests
on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch: # Manual trigger option

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}

            Your job is to write unit tests for the repository.

            Use pytest where possible.

            Please just create a single test since I am just running a proof of concept.

            Write the PR title to `title.txt`
            Write the PR body to `body.txt`

          claude_args: |
            --allowedTools "Read,Write,Edit,python"

      - name: Read title.txt
        id: title
        uses: jaywcjlove/github-action-read-file@main
        with:
          path: title.txt

      - name: Read body.txt
        id: body
        uses: jaywcjlove/github-action-read-file@main
        with:
          path: body.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          title: ${{ steps.title.outputs.content }}
          body: ${{ steps.body.outputs.content }}
          branch-suffix: timestamp
