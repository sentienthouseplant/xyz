name: Weekly Commit Summary
on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight
  workflow_dispatch: # Manual trigger option
jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get date a week ago
        run: |
          WEEK_AGO=$(date -d '7 days ago' '+%Y-%m-%d')
          echo "WEEK_AGO=$WEEK_AGO" >> $GITHUB_ENV
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Summarize the work done in this repo in the last week, since ${{ env.WEEK_AGO }}, using Slack BlockKit JSON. Write the Slack BlockKit JSON to a file called MESSAGE.json. Don't just list the commits, make thoughtful, intelligent summaries of the work done."
          claude_args: |
            --allowedTools "Write, Edit"
            --disallowedTools "Bash(git commit*), Bash(git push*), Bash(git add*), Bash(git branch*), Bash(git checkout*)"
      - name: Post to Slack
        run: cat MESSAGE.json
